<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Keyz</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
    //
    // GitHub Pages has no server-side rewrite support, so a direct request
    // for e.g. /why-keyz (hard refresh, pasted link, new tab)
    // 404s — there's no physical file at that path, only /index.html
    // exists. GitHub Pages serves THIS file for any unmatched
    // path. We redirect back to the app root, encoding the originally
    // requested path in the query string; index.html's matching script
    // decodes it via history.replaceState before React Router mounts, so
    // the correct page renders with no visible flash or redirect loop.
    //
    // pathSegmentsToKeep = 0 because the site is served at the domain root.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
